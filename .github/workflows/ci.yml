name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 后端：与本地/目标平台一致（Windows），离线 wheel 兜底
  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install deps
        # 在线优先，失败回退 scripts/libs 离线 wheel（按 CPython 3.14 win_amd64 打包）
        run: pip install --find-links=scripts/libs -r requirements.txt -r requirements-dev.txt
      - name: Type check (mypy)
        run: python -m mypy core/ server.py
      - name: Tests (pytest)
        run: python -m pytest tests/ -q
      - name: Check generated types in sync (gen:api)
        # 后端 response_model 改动后需重新生成前端类型；此处校验 generated.ts 与 openapi 一致
        shell: bash
        working-directory: web
        run: |
          echo "git:$(git --version) node:$(node --version) npm:$(npm --version)"
          git config core.autocrlf false   # 消除 windows 行尾转换对 diff 的干扰
          set +e
          python ../scripts/gen_openapi.py > gen_out.txt 2>&1
          RC=$?
          if [ $RC -ne 0 ]; then
            echo "::error::STEP1 gen_openapi.py failed (rc=$RC)"
            exit 1
          fi
          echo "STEP1 OK: $(tail -1 gen_out.txt)"
      - name: Upload gen:api error log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gen-api-error
          path: web/gen_out.txt
          npx --yes openapi-typescript@7.13.0 src/api/openapi.json -o src/api/generated.ts || { echo "::error::STEP2 openapi-typescript failed"; exit 1; }
          echo "STEP2 OK"
          if git diff --exit-code src/api/generated.ts; then
            echo "STEP3 OK: generated.ts in sync"
          else
            echo "::error::STEP3 generated.ts out of sync"
            git diff src/api/generated.ts | head -20
            exit 1
          fi

  # 前端：类型检查（vue-tsc）+ 生产构建 + 单元测试（Vitest）
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Pin npm 11 (lockfile generated by npm 11)
        # npm 10 读 npm 11 生成的 lock 会误解析 esbuild（报 Missing @esbuild/*），固定版本与本地一致
        run: npm install -g npm@11
      - name: Install deps
        run: |
          if ! npm ci; then
            LOG=$(npm ci --loglevel=verbose 2>&1 | tail -50)
            echo "::error::npm ci failed. verbose tail:${LOG//$'\n'/%0A}"
            exit 1
          fi
      - name: Type check & build
        run: npm run build
      - name: Unit tests
        run: npm test
