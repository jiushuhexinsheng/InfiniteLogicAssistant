# 技能定义：每日天气 — 查询指定城市今日天气并给出穿衣/出行建议。
# Skill definition: Daily Weather — query today's weather for the specified city and provide clothing/travel advice.
name: 每日天气
description: 查询指定城市今日天气并给出穿衣/出行建议。Query today's weather for the specified city and provide clothing/travel suggestions.
requires:
  - city
steps:
  - tool: get_weather
    args_template:
      city: "{{city}}"
    note: 查询城市当前天气。Query the current weather of the city.
  - tool: get_datetime
    args_template: {}
    note: 获取当前日期时间。Get the current date and time.
dangerous: false
